name: Deploy Docker to Azure - 10xVagas

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name cr10xvagas

      - name: Build and push backend Docker image
        run: |
          docker build -f backend/Dockerfile -t cr10xvagas.azurecr.io/10xvagas-backend:latest .
          docker push cr10xvagas.azurecr.io/10xvagas-backend:latest

      - name: Build and push frontend Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }} \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }} \
            --build-arg NEXT_PUBLIC_API_URL=https://web-backend-10xvagas.azurewebsites.net \
            --build-arg NEXT_PUBLIC_APP_URL=${{ secrets.FRONTEND_URL || 'https://web-frontend-10xvagas.azurewebsites.net' }} \
            -t cr10xvagas.azurecr.io/10xvagas-frontend:latest \
            -f frontend/Dockerfile .
          docker push cr10xvagas.azurecr.io/10xvagas-frontend:latest

      - name: Build and push engine Docker image
        run: |
          docker build -f engine/Dockerfile -t cr10xvagas.azurecr.io/10xvagas-engine:latest .
          docker push cr10xvagas.azurecr.io/10xvagas-engine:latest

      - name: Deploy containers to Azure Web Apps
        run: |
          az webapp config container set \
            --name web-backend-10xvagas \
            --resource-group resource-10xvagas \
            --docker-custom-image-name cr10xvagas.azurecr.io/10xvagas-backend:latest

          az webapp config container set \
            --name web-frontend-10xvagas \
            --resource-group resource-10xvagas \
            --docker-custom-image-name cr10xvagas.azurecr.io/10xvagas-frontend:latest

          az webapp config container set \
            --name web-engine-10xvagas \
            --resource-group resource-10xvagas \
            --docker-custom-image-name cr10xvagas.azurecr.io/10xvagas-engine:latest

      - name: Restart Azure Web Apps
        run: |
          az webapp restart --name web-backend-10xvagas --resource-group resource-10xvagas
          az webapp restart --name web-frontend-10xvagas --resource-group resource-10xvagas
          az webapp restart --name web-engine-10xvagas --resource-group resource-10xvagas
          echo "✅ Deploy concluído!"
