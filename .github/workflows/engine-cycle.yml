name: Ciclo de vagas e matching - 10xVagas

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: engine-cycle-production
  cancel-in-progress: false

jobs:
  collect-and-match:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validar configuracao
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::NEXT_PUBLIC_SUPABASE_URL nao configurada"; exit 1; }
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || { echo "::error::SUPABASE_SERVICE_ROLE_KEY nao configurada"; exit 1; }

      - name: Executar coleta e matching
        run: python3 -m engine.run_cycle
